id: ADSL
label: Subject Level Analysis Dataset
class: SUBJECT LEVEL ANALYSIS DATASET
structure: One record per subject
keys:
  - USUBJID
  - STUDYID

population:
  base:
    - domain: DM
      depends:
        - AGEU
      filter: '!is.na(AGEU)'
    - domain: DM_VACCINE
      depends:
        - NA
      filter: NA
  global:
    - filter: 'STUDYID == "CDISCPILOT01"'
      depends:
        - STUDYID
    - filter: 'DOMAIN == "DM"'
      depends:
        - DOMAIN
    - filter: 'EFFICACY == "Y"'
      depends:
        - EFFICACY

columns:
  - id: STUDYID

  - id: USUBJID

  - id: AGEU

  - id: DOMAIN

  - id: ARM

  - id: PLANNED_ARM
    method: ADSL.ARM

  - id: ARM_GRP1
    component:
      id: "arm_group_01.R"

  - id: EFFICACY
    component:
      id: "supp_dm_01.R"

  - id: SAFETY
    component:
      id: "supp_dm_01.R"
