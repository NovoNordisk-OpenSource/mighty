---
# TEMPORARY EXPERIMENT - do not merge.
# Checks whether compiling C code with GCC 13 on ubuntu-latest (26.04) avoids
# the later 1.4.4 build failure in the NN versions check.
name: Package specific setup
description: Use GCC 13 for C code on Linux (experiment)
runs:
  using: composite
  steps:
    - name: Use GCC 13 for C code
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-13
        gcc-13 --version | head -1
        echo "CC = gcc-13" > "$RUNNER_TEMP/Makevars"
        echo "R_MAKEVARS_USER=$RUNNER_TEMP/Makevars" >> "$GITHUB_ENV"
