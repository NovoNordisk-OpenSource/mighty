name: All actions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions: {}
jobs:
  check-current-version:
    name: Check current version
    permissions:
      contents: read
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/check_current_version.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
  check-nn-version:
    name: Check NN version
    permissions:
      contents: read
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/check_nn_versions.yaml@d92f1f74690c504f5e479e9e8a4a77eec1eda439 # feat/nn-extra-packages
    with:
      min_lock_date: "2025-12-05"
      # Binaries from r-universe are built against S7 >= 1.0.0, which S7 0.2.x in the snapshot can't load
      extra_packages: |
        mighty.metadata=?source
        S7schema=?source
        mighty.component=?source
  pkgdown:
    name: Pkgdown site
    permissions:
      contents: write
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/pkgdown.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
  coverage:
    name: Coverage report
    permissions:
      contents: read
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/coverage.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      use_codecov: true
  megalinter:
    name: Megalinter
    permissions:
      contents: read
      pull-requests: write
    uses: NovoNordisk-OpenSource/r.workflows/.github/workflows/megalinter.yaml@0e2ad584b07bb08b72b387587c50ff3e9fb4fab2 # v0.1.2
